<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能下注 - 世界杯彩票盈利系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a3a5c, #0f1923); padding: 12px 40px; display: flex; align-items: center; gap: 24px; border-bottom: 2px solid #2c5f2d; }
.header h1 { font-size: 1.3rem; color: #ffd700; white-space: nowrap; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 16px; border-radius: 6px; color: #aaa; text-decoration: none; font-size: .85rem; background: #1a2a38; border: 1px solid #2a3a48; }
.nav a.active { background: #2c5f2d; color: #fff; border-color: #2c5f2d; }
.nav a:hover { border-color: #3a8a3a; }
.main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 40px; }
.card { background: #1a2a38; border-radius: 10px; padding: 20px; border: 1px solid #2a3a48; }
.card h3 { color: #ffd700; margin-bottom: 14px; font-size: .95rem; }
.full-width { grid-column: 1 / -1; }
.context-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.ctx-item { background: #0f1923; border-radius: 8px; padding: 10px; text-align: center; }
.ctx-item .val { font-size: 1.3rem; font-weight: bold; color: #ffd700; }
.ctx-item .lbl { font-size: .7rem; color: #888; margin-top: 2px; }
.ctx-item .alert { color: #f44336; }
.form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.form-row label { font-size: .78rem; color: #aaa; display: block; margin-bottom: 2px; }
.form-row input, .form-row select { padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3a3a; background: #0f1923; color: #fff; font-size: .85rem; }
.form-row select { min-width: 260px; }
.btn { padding: 9px 20px; border-radius: 6px; border: 1px solid #3a8a3a; background: #2c5f2d; color: #fff; cursor: pointer; font-size: .9rem; font-weight: bold; }
.btn:hover { background: #3a8a3a; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.recommend-card { background: #0f1923; border-radius: 10px; padding: 16px; border: 1px solid #2a3a48; }
.recommend-card .strat-name { font-size: .8rem; color: #888; margin-bottom: 8px; }
.recommend-card .action { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
.recommend-card .action.bet { color: #4caf50; }
.recommend-card .action.skip { color: #888; }
.recommend-card .detail { font-size: .82rem; color: #aaa; line-height: 1.6; }
.recommend-card .detail span { color: #ffd700; }
.recommend-card .reason { margin-top: 10px; padding: 8px 10px; background: #1a2a38; border-radius: 6px; font-size: .78rem; color: #999; line-height: 1.5; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.metric-item { background: #1a2a38; border-radius: 6px; padding: 8px; text-align: center; }
.metric-item .val { font-size: 1rem; font-weight: bold; }
.metric-item .lbl { font-size: .7rem; color: #888; }
.positive { color: #4caf50; }
.negative { color: #f44336; }
</style>
</head>
<body>

<div class="header">
  <h1>世界杯彩票盈利系统</h1>
  <div class="nav">
    <a href="/">回测系统</a>
    <a href="/manual">手动投注</a>
    <a href="/smart" class="active">智能下注</a>
  </div>
</div>

<div class="main">
  <!-- 统计上下文 -->
  <div class="card full-width">
    <h3>实时统计窗口 <span style="color:#888;font-weight:normal;font-size:.8rem;" id="contextMeta"></span></h3>
    <div class="context-grid" id="contextGrid">
      <div class="ctx-item"><div class="val" id="ctxSettled">0</div><div class="lbl">已结算场次</div></div>
      <div class="ctx-item"><div class="val" id="ctxUpset">--</div><div class="lbl">12场冷门率</div></div>
      <div class="ctx-item"><div class="val" id="ctxDraw">--</div><div class="lbl">12场平局率</div></div>
      <div class="ctx-item"><div class="val" id="ctxUnder">--</div><div class="lbl">12场小球率</div></div>
      <div class="ctx-item"><div class="val" id="ctxPhase">--</div><div class="lbl">动量策略状态</div></div>
    </div>
  </div>

  <!-- 分析输入 -->
  <div class="card full-width">
    <h3>推荐分析</h3>
    <div class="form-row">
      <div>
        <label>选择比赛</label>
        <select id="smartMatch"></select>
      </div>
      <div>
        <label>主胜赔率</label>
        <input type="number" id="smartHome" step="0.01" min="1.01" style="width:100px">
      </div>
      <div>
        <label>平局赔率</label>
        <input type="number" id="smartDraw" step="0.01" min="1.01" style="width:100px">
      </div>
      <div>
        <label>客胜赔率</label>
        <input type="number" id="smartAway" step="0.01" min="1.01" style="width:100px">
      </div>
      <button class="btn" id="analyzeBtn" onclick="analyze()">分析</button>
    </div>
  </div>

  <!-- 推荐结果 -->
  <div class="card" id="fiveCard">
    <div class="strat-name">策略: 五信号动态统计</div>
    <div class="action skip" id="fiveAction">等待分析...</div>
    <div class="detail" id="fiveDetail" style="display:none;">
      <div class="metrics">
        <div class="metric-item"><div class="val" id="fiveConf">--</div><div class="lbl">置信度</div></div>
        <div class="metric-item"><div class="val" id="fiveMult">--</div><div class="lbl">注额倍数</div></div>
        <div class="metric-item"><div class="val" id="fiveOdds">--</div><div class="lbl">推荐赔率</div></div>
      </div>
    </div>
    <div class="reason" id="fiveReason">选择比赛并填入赔率后点击分析</div>
  </div>

  <div class="card" id="momentumCard">
    <div class="strat-name">策略: 锦标赛动量</div>
    <div class="action skip" id="moAction">等待分析...</div>
    <div class="detail" id="moDetail" style="display:none;">
      <div class="metrics">
        <div class="metric-item"><div class="val" id="moConf">--</div><div class="lbl">置信度</div></div>
        <div class="metric-item"><div class="val" id="moOdds">--</div><div class="lbl">推荐赔率</div></div>
      </div>
    </div>
    <div class="reason" id="moReason">选择比赛并填入赔率后点击分析</div>
  </div>
</div>

<script>
const API = '';

async function loadContext() {
  const resp = await fetch(API + '/api/smart/context');
  const ctx = await resp.json();
  document.getElementById('ctxSettled').textContent = ctx.settled_count;
  document.getElementById('ctxUpset').textContent = (ctx.upset_rate * 100).toFixed(0) + '%';
  document.getElementById('ctxUpset').className = 'val' + (ctx.upset_rate > 0.25 ? ' alert' : '');
  document.getElementById('ctxDraw').textContent = (ctx.draw_rate * 100).toFixed(0) + '%';
  document.getElementById('ctxDraw').className = 'val' + (ctx.draw_rate > 0.25 ? ' alert' : '');
  document.getElementById('ctxUnder').textContent = (ctx.under_rate * 100).toFixed(0) + '%';
  document.getElementById('ctxPhase').textContent = {observing:'观察中',bet_fav:'押热门',bet_dog:'押下盘',skip:'观望'}[ctx.momentum_phase] || ctx.momentum_phase;
  document.getElementById('contextMeta').textContent = `窗口${ctx.window_size}场 · 动量: ${ctx.momentum_phase}`;
}

async function loadMatches() {
  const resp = await fetch(API + '/api/manual/matches?is_settled=0&page_size=200');
  const data = await resp.json();
  const sel = document.getElementById('smartMatch');
  sel.innerHTML = '<option value="">-- 选择比赛 --</option>';
  data.data.forEach(m => {
    sel.add(new Option(`${m.match_day} [${m.stage}] ${m.team_home} vs ${m.team_away}`, m.id));
  });
}

async function analyze() {
  const matchId = document.getElementById('smartMatch').value;
  if (!matchId) { alert('请选择比赛'); return; }
  const odds_home = parseFloat(document.getElementById('smartHome').value);
  const odds_draw = parseFloat(document.getElementById('smartDraw').value);
  const odds_away = parseFloat(document.getElementById('smartAway').value);
  if (!odds_home || !odds_draw || !odds_away) { alert('请填入三项赔率'); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true; btn.textContent = '分析中...';
  try {
    const resp = await fetch(API + '/api/smart/recommend', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({match_id: parseInt(matchId), odds_home, odds_draw, odds_away})
    });
    const r = await resp.json();
    if (r.error) { alert(r.error); return; }

    // 五信号结果
    const fs = r.five_signal;
    const fiveAct = document.getElementById('fiveAction');
    fiveAct.textContent = fs.action;
    fiveAct.className = 'action ' + (fs.bet_on ? 'bet' : 'skip');
    if (fs.bet_on) {
      document.getElementById('fiveDetail').style.display = 'block';
      document.getElementById('fiveConf').textContent = (fs.confidence * 100).toFixed(0) + '%';
      document.getElementById('fiveMult').textContent = fs.stake_mult + 'x';
      document.getElementById('fiveOdds').textContent = fs.odds ? fs.odds.toFixed(2) : '--';
    } else {
      document.getElementById('fiveDetail').style.display = 'none';
    }
    document.getElementById('fiveReason').textContent = fs.reason;

    // 动量结果
    const mo = r.momentum;
    const moAct = document.getElementById('moAction');
    moAct.textContent = mo.action;
    moAct.className = 'action ' + (mo.bet_on ? 'bet' : 'skip');
    if (mo.bet_on) {
      document.getElementById('moDetail').style.display = 'block';
      document.getElementById('moConf').textContent = (mo.confidence * 100).toFixed(0) + '%';
      document.getElementById('moOdds').textContent = mo.odds ? mo.odds.toFixed(2) : '--';
    } else {
      document.getElementById('moDetail').style.display = 'none';
    }
    document.getElementById('moReason').textContent = mo.reason;

    loadContext();
  } finally {
    btn.disabled = false; btn.textContent = '分析';
  }
}

loadContext();
loadMatches();
</script>
</body>
</html>
