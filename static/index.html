<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界杯彩票盈利系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { width: 380px; background: #1a2a38; border-radius: 16px; padding: 32px; border: 1px solid #2a3a48; text-align: center; }
h1 { color: #ffd700; font-size: 1.4rem; margin-bottom: 6px; }
.sub { color: #666; font-size: .8rem; margin-bottom: 28px; }
.links { display: flex; flex-direction: column; gap: 12px; }
.links a { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 1rem; font-weight: bold; background: #0f1923; border: 1px solid #2a3a48; transition: all .2s; }
.links a:hover { border-color: #ffd700; background: #1a2a38; }
.links a .icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
.icon.manual { background: #1a5276; }
.icon.smart { background: #7d4e1a; }
.links a .desc { font-size: .75rem; font-weight: normal; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>世界杯彩票盈利系统</h1>
  <p class="sub">2026 World Cup Betting — 均值回归策略</p>
  <div class="links">
    <a href="/manual">
      <span class="icon manual">&#x1F4DD;</span>
      <div>
        手动投注
        <div class="desc">比赛管理 · 赔率录入 · 下注 · 自动结算</div>
      </div>
    </a>
    <a href="/smart">
      <span class="icon smart">&#x1F9E0;</span>
      <div>
        智能分析
        <div class="desc">双窗口统计 · 多维度均值回归推荐</div>
      </div>
    </a>
  </div>
</div>
</body>
</html>
